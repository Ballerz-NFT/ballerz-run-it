<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BALLERZ · RUN IT</title>
<meta name="description" content="Open packs, collect all 9,769 Ballerz, build a five-man lineup and run it. A collectible card game for Ballerz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080808;--panel:#121214;--panel-2:#1a1a1e;--line:#2a2a30;--bone:#F2EFE6;--dim:#8b8b95;
  --leather:#FF5A1F;--court:#2F6BFF;--gold:#FFC53D;--good:#27C281;--bad:#ff4d5e;--purple:#B06BFF;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--bone);font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;}
body{min-height:100vh;padding-bottom:84px;background:radial-gradient(1200px 500px at 50% -120px,#1c1209 0,transparent 70%),var(--ink)}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
select,input{font-family:inherit;color:var(--bone);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
h1,h2,h3{font-family:'Anton',Impact,sans-serif;font-weight:400;letter-spacing:.03em;margin:0}
.mono{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(8,8,8,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.logo{font-family:'Anton';font-size:20px;letter-spacing:.06em;white-space:nowrap}
.logo b{color:var(--leather);font-weight:400}
.chips{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.chip small{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.12em;color:var(--dim);font-weight:400}
.chip.hot{border-color:var(--leather);color:var(--leather)}
.heat{width:46px;height:6px;background:#2a2a30;border-radius:3px;overflow:hidden}
.heat i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--leather))}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,10,12,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:8px;padding-bottom:8px}
.nav button{padding:10px 4px;border-radius:10px;font-family:'Anton';letter-spacing:.08em;font-size:15px;color:var(--dim)}
.nav button.on{background:var(--leather);color:#000}

/* generic */
.sec{margin:20px 0}
.sec>h2{font-size:26px;margin-bottom:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;font-family:'Anton';letter-spacing:.07em;font-size:17px;background:var(--panel-2);border:1px solid var(--line)}
.btn.primary{background:var(--leather);color:#000;border-color:var(--leather)}
.btn.gold{background:var(--gold);color:#000;border-color:var(--gold)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.big{padding:16px 26px;font-size:22px}
.pill{display:inline-block;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.1em;padding:3px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--bone)}
.bar{height:8px;border-radius:4px;background:#25252b;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--court),var(--good))}
.muted{color:var(--dim)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:#2a2a30;display:block}
.dots i.on{background:var(--leather)}
.dots i.cur{box-shadow:0 0 0 2px var(--gold)}

/* cards */
.card{--tc:#8b8b95;position:relative;container-type:inline-size;aspect-ratio:5/7;border-radius:10px;border:2px solid var(--tc);background:linear-gradient(165deg,#202027,#0e0e11);overflow:hidden;display:flex;flex-direction:column;text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 0 1px var(--tc)}
.card .ct{display:flex;justify-content:space-between;align-items:baseline;padding:2.5cqw 5cqw 0}
.card .ovr{font-family:'Anton';font-size:15cqw;line-height:1;color:var(--tc)}
.card .tier{font-family:'IBM Plex Mono';font-size:6cqw;letter-spacing:.12em;color:var(--tc)}
.card .art{flex:1;min-height:0;margin:1cqw 4cqw;border-radius:8px;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--tc) 40%,#000) 0,#0a0a0c 78%)}
.card .art img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
.card .art .fallback{position:absolute;font-family:'Anton';font-size:16cqw;color:#ffffff22}
.card .nm{padding:1cqw 5cqw;font-family:'Anton';font-size:10cqw;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.card .nm .id{flex:none}
.card .nm small{flex:1;min-width:0;text-align:right;font-family:'IBM Plex Mono';font-size:5.2cqw;color:var(--dim);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sks{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5cqw;padding:0 3cqw 3cqw}
.card .sk{background:#0c0c0f;border-top:2px solid var(--k);border-radius:4px;text-align:center;padding:1.5cqw 0}
.card .sk b{display:block;font-family:'Anton';font-weight:400;font-size:10cqw;line-height:1.1}
.card .sk span{font-family:'IBM Plex Mono';font-size:4.6cqw;color:var(--dim);letter-spacing:.04em}
.card .sk.on{background:var(--k)}
.card .sk.on b,.card .sk.on span{color:#000}
.card .abs{position:absolute;left:3cqw;top:20cqw;display:flex;flex-direction:column;gap:1cqw}
.card .abs i{font-style:normal;font-family:'IBM Plex Mono';font-size:4.4cqw;background:#000a;border:1px solid var(--tc);color:var(--bone);padding:.6cqw 1.8cqw;border-radius:4px}
.card .ed{position:absolute;right:3cqw;top:20cqw;font-family:'IBM Plex Mono';font-size:4.6cqw;letter-spacing:.1em;padding:.6cqw 2cqw;border-radius:4px;background:#000a}
.card.ed1{box-shadow:0 0 0 1px #6ff3ff80,0 0 18px #6ff3ff40}
.card.ed1::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,#6ff3ff33 45%,#d27bff33 55%,transparent 70%);background-size:250% 100%;animation:sheen 3.5s linear infinite}
.card.ed2{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px #ffc53d55}
.card.ed2::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,#ffe9a655 48%,transparent 66%);background-size:250% 100%;animation:sheen 2.6s linear infinite}
.ed1 .ed{color:#6ff3ff}.ed2 .ed{color:var(--gold)}
@keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
.card .mark{position:absolute;right:3cqw;bottom:34cqw;font-family:'Anton';font-size:9cqw;color:var(--gold)}
.card.sel{outline:3px solid var(--gold);outline-offset:2px;transform:translateY(-4px)}
.card.tired{filter:saturate(.45) brightness(.8)}
.card .tiredtag{position:absolute;left:0;right:0;top:44%;text-align:center;font-family:'Anton';font-size:11cqw;color:var(--bad);background:#000b;padding:1cqw 0;letter-spacing:.1em}
.card.locked{opacity:.32;filter:grayscale(1)}
.card.empty{border-style:dashed;background:#0c0c0f;display:grid;place-items:center;color:#ffffff30;font-family:'Anton';font-size:14cqw;cursor:default}
.card.mini .abs,.card.mini .nm small,.card.mini .tier,.card.mini .ed{display:none}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.cgrid.sm{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.slot{aspect-ratio:5/7;border-radius:10px;border:2px dashed var(--line);background:#0c0c0f;display:grid;place-items:center;color:#ffffff30;font-family:'Anton';font-size:22px}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:720px){
  .five{grid-template-columns:repeat(3,1fr);gap:10px}
  .five.opp{grid-template-columns:repeat(5,1fr);gap:5px}
}
@media(max-width:560px){
  .five.opp .card .sk:not(.on){display:none}
  .five.opp .card .sks{grid-template-columns:1fr;padding:0 2cqw 2cqw}
  .five.opp .card .sk.on b{font-size:19cqw}
  .five.opp .card .sk.on span{display:none}
  .five.opp .card .ovr{font-size:17cqw}
  .five.opp .card .nm{display:none}
  .chip small.lbl{display:none}
  .logo{font-size:16px}
  .chips{gap:4px}
  .heat{width:32px}
  .score .pts{font-size:42px}
}
.chip small.ico{display:none;font-size:13px;letter-spacing:0}
@media(max-width:560px){.chip small.ico{display:inline}}

/* binder tiles */
.tile{aspect-ratio:5/7;border-radius:8px;border:1px solid var(--line);background:#0d0d10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#ffffff40;cursor:pointer;font-family:'Anton';font-size:15px;position:relative}
.tile small{font-family:'IBM Plex Mono';font-size:9px;color:#ffffff40;letter-spacing:.08em}
.tile i{position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%;background:var(--tc)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:8px 12px;font-size:13px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--bone);color:#000}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:18px 0}
.team{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.team img{width:34px;height:34px;object-fit:contain}
.team .tb{flex:1;min-width:0}
.team .tn{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .bar{margin-top:6px}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);overflow:auto;padding:20px 12px}
#modal.on{display:block}
.mbox{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;position:relative}
.mbox.wide{max-width:980px}
.mx{position:absolute;right:10px;top:10px;font-size:22px;color:var(--dim);padding:6px 10px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--bone);color:#000;font-weight:700;padding:9px 16px;border-radius:999px;box-shadow:0 6px 24px #000a;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* pack reveal */
.rvg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
@media(max-width:640px){.rvg{grid-template-columns:repeat(3,1fr)}}
.flip{perspective:900px;aspect-ratio:5/7;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.face .card{width:100%;height:100%}
.back{border-radius:10px;border:2px solid var(--leather);background:repeating-linear-gradient(45deg,#16110d 0 10px,#1c140d 10px 20px);display:grid;place-items:center;text-align:center;font-family:'Anton';color:var(--leather);font-size:5.5vw;line-height:1}
@media(min-width:720px){.back{font-size:30px}}
.back small{display:block;font-family:'IBM Plex Mono';font-size:9px;color:var(--dim);letter-spacing:.2em;margin-top:6px}
.flip .tag{position:absolute;left:50%;top:-10px;transform:translateX(-50%);z-index:3;font-family:'IBM Plex Mono';font-size:10px;font-weight:600;letter-spacing:.1em;padding:3px 8px;border-radius:999px;background:var(--good);color:#000;white-space:nowrap;opacity:0;transition:opacity .3s .4s}
.flip.on .tag{opacity:1}
.flip.leg.on .face.front .card{animation:legend 1.2s ease-out}
@keyframes legend{0%{box-shadow:0 0 0 0 #ffc53d}60%{box-shadow:0 0 0 24px #ffc53d00}100%{box-shadow:none}}

/* match */
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.score .side{min-width:0}
.score .nm{font-family:'Anton';font-size:15px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .pts{font-family:'Anton';font-size:54px;line-height:1}
.score .vs{font-family:'IBM Plex Mono';color:var(--dim);font-size:11px;letter-spacing:.2em}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.qb{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:var(--panel)}
.qb.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.qb .q{font-family:'IBM Plex Mono';font-size:10px;color:var(--dim);letter-spacing:.14em}
.qb .f{font-family:'Anton';font-size:18px;color:var(--k)}
.qb .r{font-family:'IBM Plex Mono';font-size:11px;margin-top:2px;min-height:15px}
.qb.w .r{color:var(--good)}.qb.l .r{color:var(--bad)}
.focus{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;border:1px solid var(--k);background:color-mix(in srgb,var(--k) 14%,#0c0c0f)}
.focus .fk{font-family:'Anton';font-size:30px;color:var(--k);letter-spacing:.05em}
.vsrow{display:grid;grid-template-columns:1fr 60px 1fr;gap:12px;align-items:start}
@media(max-width:560px){.vsrow{grid-template-columns:1fr 36px 1fr}}
.vsrow .mid{align-self:center;text-align:center;font-family:'Anton';font-size:22px;color:var(--dim)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc{font-size:13px;margin-top:8px;color:var(--dim);line-height:1.5}
.calc b{color:var(--bone)}
.big-score{font-family:'Anton';font-size:42px;line-height:1}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:400}
.w{color:var(--good);font-weight:700}.l{color:var(--bad);font-weight:700}
.crewlogo{width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:6px}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;background:var(--panel-2)}
.lv.done{border-color:var(--good)}
.lv.cur{border-color:var(--leather);box-shadow:0 0 0 1px var(--leather)}
.lv b{display:block;font-family:'Anton';font-weight:400;font-size:20px}
.lv span{font-family:'IBM Plex Mono';font-size:8.5px;letter-spacing:.06em;color:var(--dim)}
.ms{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ms:last-child{border:0}
.ms .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.ms.done .ck{background:var(--good);border-color:var(--good);color:#000}
.ms .t{flex:1;min-width:0}
.ms .t b{display:block;font-size:14px}.ms .t span{font-size:12px;color:var(--dim)}
.foot{margin:40px 0 20px;text-align:center}
.foot a{color:var(--leather)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv span:nth-child(odd){color:var(--dim)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<noscript><p style="padding:24px">BALLERZ · RUN IT needs JavaScript.</p></noscript>

<script>
'use strict';
/*DATA:START*/
const DATA={
teams:["Alabama Kingpins","Alaska Whales","All-Stars","Austin Machines","Boston Rulers","Boulder Elks","Charlotte Clovers","Chicago Squid","Cleveland Firebirds","D.C. Dobermans","Dallas Pythons","Delaware Horsemen","Helena Pronghorns","Houston Rogues","Iowa City Rattlesnakes","Las Vegas Scorpions","Los Angeles Knives","Los Angeles Mammoths","Miami Tentacles","Michigan Colliders","Minneapolis Express","Nashville Miracle","New Jersey Scientists","New Orleans Giants","New York Golden Bulls","New York Torches","Omaha Bullsnakes","Orlando Freeze","Pennsylvania Fangs","Phoenix Skulls","Portland Bats","Portland Creatures","Salt Lake City Souls","San Diego Keepers","San Francisco Surge","San Jose Sirens","Seattle Scream","Sierra Spiders","St. Louis Orcs","Tallahassee Tarantulas","Tampa Bay Omens","Team Dapper (M)","Team Dapper (W)","Team Flow (M)","Team Flow (W)","Toronto Spears","Wisconsin Dragons"],

/* ============================ RNG ============================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=(a,r=Math.random)=>a[Math.floor(r()*a.length)];
function weighted(w,r=Math.random){const t=w.reduce((x,y)=>x+y,0);let x=r()*t;for(let i=0;i<w.length;i++){if((x-=w[i])<0)return i;}return w.length-1;}

/* ============================ CHEMISTRY & SCORING ============================ */
function chem(a,b){
  let v=0;const parts=[];
  if(a.t===b.t){v+=3;parts.push('same team +3');}
  if(a.b===b.b||bodyFam(a)===bodyFam(b)&&bodyFam(a)!=='Human'&&/Zombie|Alien/.test(bodyFam(a))){v+=2;parts.push('same body +2');}
  if(a.a.some(x=>b.a.includes(x))){v+=2;parts.push('shared accessory +2');}
  return {v:Math.min(v,6),parts};
}
function mkSide(name,cards,bonusFn,isMe,team){
  const cnt={};cards.forEach(c=>cnt[c.t]=(cnt[c.t]||0)+1);
  let st=-1,m=0;for(const t in cnt){if(cnt[t]>m){m=cnt[t];st=+t;}}
  const sb=m>=5?4:m===4?2:m===3?1:0;
  const bonus={};cards.forEach(c=>bonus[c.id]=bonusFn(c));
  return {name,cards,bonus,tired:new Set(),pts:0,stackTeam:sb?st:-1,stackB:sb,isMe,team:team==null?-1:team};
}
function skillOf(side,c,focus,lead){
  const ab=c.ab;let s=side.bonus[c.id]||0;const notes=[];
  if(ab.includes('FREAK')){s+=Math.max(c.D,c.S,c.P,c.F)-5;notes.push('Freak: best skill −5');}else s+=c[focus];
  if(side.tired.has(c.id)&&!ab.includes('UNDEAD')){s-=TIRED;notes.push(`Tired −${TIRED}`);}
  if(ab.includes('WALL')&&focus==='F'){s+=5;notes.push('Stonewall +5');}
  if(ab.includes('COLD')&&lead<0){s+=5;notes.push('Cold-Blooded +5');}
  if(ab.includes('HELL')&&lead>0){s+=5;notes.push('Hellfire +5');}
  if(ab.includes('MVP')){s+=4;notes.push('MVP +4');}
  if(ab.includes('ALLSTAR')){s+=3;notes.push('All-Star +3');}
  if(side.stackB&&c.t===side.stackTeam){s+=side.stackB;notes.push(`Team stack +${side.stackB}`);}
  return {v:s,notes};
}
function pairCalc(side,a,b,focus,lead){
  const A=skillOf(side,a,focus,lead),B=skillOf(side,b,focus,lead);
  let tot=A.v+B.v;const notes=[];
  [[a,b],[b,a]].forEach(([x])=>{
    if(x.ab.includes('HYPE')){tot+=3;notes.push(`#${x.id} Hype Man +3`);}
    if(x.ab.includes('CAPTAIN')){tot+=2;notes.push(`#${x.id} Captain +2`);}
  });
  const ch=chem(a,b);
  if(ch.v){tot+=ch.v;notes.push('Chemistry +'+ch.v+' ('+ch.parts.join(', ')+')');}
  return {tot,a:A,b:B,notes,pts:Math.round(tot*PTS_K)};
}
function aiPick(side,focus,lead,r,noise){
  const av=side.cards;let best=null,bv=-1e9;
  for(let i=0;i<av.length;i++)for(let j=i+1;j<av.length;j++){
    const p=pairCalc(side,av[i],av[j],focus,lead);
    const v=p.tot+(r()*2-1)*noise;
    if(v>bv){bv=v;best=[av[i],av[j]];}
  }
  return best;
}

/* ============================ PACKS ============================ */
const PACK_STD=[50,30,14,5,1], HIT_STD=[0,70,20,8,2], PACK_PRE=[0,35,40,20,5], HIT_PRE=[0,0,0,85,15];
function nearPool(team,tier){
  for(let t=tier;t>=0;t--){const p=TEAMPOOL[team][t];if(p.length)return p;}
  for(let t=tier+1;t<5;t++){const p=TEAMPOOL[team][t];if(p.length)return p;}
  return TEAMCARDS[team];
}
function rollPack(kind,r=Math.random,team=null){
  const out=[];
  for(let i=0;i<5;i++){
    const w=i===4?(kind==='pre'?HIT_PRE:HIT_STD):(kind==='pre'?PACK_PRE:PACK_STD);
    const tier=weighted(w,r);
    let c,tries=0;
    do{c=pick(team==null?TPOOL[tier]:nearPool(team,tier),r);tries++;}while(out.includes(c)&&tries<8);
    out.push(c);
  }
  return out;
}
function addCards(list){
  return list.map(c=>{
    const had=S.cards[c.id]||0;
    S.cards[c.id]=had+1;
    let up=null;
    if(had){
      const before=edOf(S.reps[c.id]||0);
      S.reps[c.id]=(S.reps[c.id]||0)+5;
      const after=edOf(S.reps[c.id]);
      if(after>before)up=after;
    }
    return {c,isNew:!had,dup:!!had,up};
  });
}
function bestFive(){
  const mine=Object.keys(S.cards).map(id=>BY.get(+id));
  if(!mine.length)return [];
  const score=l=>{
    const cnt={};l.forEach(c=>cnt[c.t]=(cnt[c.t]||0)+1);
    const m=Math.max(...Object.values(cnt));
    const sb=l.length>=5&&m>=5?4:m===4?2:m===3?1:0;
    return l.reduce((a,c)=>a+effOvr(c,bonusOf(c.id)),0)/l.length+sb*0.8;
  };
  const byOvr=mine.slice().sort((a,b)=>effOvr(b,bonusOf(b.id))-effOvr(a,bonusOf(a.id)));
  let best=byOvr.slice(0,5),bs=score(best);
  const teams=new Set(mine.map(c=>c.t));
  teams.forEach(t=>{
    const tc=byOvr.filter(c=>c.t===t).slice(0,5);
    if(tc.length<3)return;
    const fill=byOvr.filter(c=>!tc.includes(c)).slice(0,5-tc.length);
    const cand=tc.concat(fill);
    const s=score(cand);
    if(s>bs){bs=s;best=cand;}
  });
  return best.map(c=>c.id);
}
function autoLineup(force){
  if(force||S.lineup.length<5){
    const f=bestFive();
    if(f.length>=Math.min(5,owned()))S.lineup=f;
  }
}
function addHeat(n){
  S.heat+=n;
  while(S.heat>=100){S.heat-=100;S.packs.std++;toast('Heat full — +1 pack');}
}
function grant(r){
  const bits=[];
  if(r.std){S.packs.std+=r.std;bits.push(`${r.std} pack${r.std>1?'s':''}`);}
  if(r.pre){S.packs.pre+=r.pre;bits.push(`${r.pre} premium`);}
  if(r.dap){S.dap+=r.dap;bits.push(`${r.dap} Dap`);}
  return bits.join(' + ');
}

function lineupAvg(){
  const l=S.lineup.map(id=>BY.get(id)).filter(Boolean);
  if(!l.length)return 78;
  return l.reduce((a,c)=>a+effOvr(c,bonusOf(c.id)),0)/l.length;
}
function runTarget(lvl,myAvg){
  return Math.max(74,Math.min(95,myAvg+LEVEL_OFF[lvl]+Math.min(S.run.cycle,4)*0.8));
}

function viewLineup(){
  const L=UI.l;
  const slots=[];
  for(let i=0;i<5;i++){
    const id=S.lineup[i];
    slots.push(id?cardHTML(BY.get(id),{act:'unslot',arg:id}):`<div class="slot">${i+1}</div>`);
  }
  const l=S.lineup.map(id=>BY.get(id));
  let stack='—',best='—';
  if(l.length>=2){
    const cnt={};l.forEach(c=>cnt[c.t]=(cnt[c.t]||0)+1);
    const m=Math.max(...Object.values(cnt));
    const sb=m>=5?4:m===4?2:m===3?1:0;
    const tn=DATA.teams[+Object.keys(cnt).find(t=>cnt[t]===m)];
    stack=sb?`${m}× ${tn} (+${sb} each)`:'none (3 of a team = +1, 4 = +2, 5 = +4)';
    let bc={v:-1};
    for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){const ch=chem(l[i],l[j]);if(ch.v>bc.v)bc={v:ch.v,a:l[i],b:l[j],parts:ch.parts};}
    best=bc.v>0?`#${bc.a.id} + #${bc.b.id}: +${bc.v} (${bc.parts.join(', ')})`:'none yet';
  }
  const mine=Object.keys(S.cards).map(id=>BY.get(+id));
  let list=mine.filter(c=>!S.lineup.includes(c.id));
  if(L.team>=0)list=list.filter(c=>c.t===L.team);

  if(L.q&&+L.q)list=list.filter(c=>c.id===+L.q);
  list.sort((a,b)=>effOvr(b,bonusOf(b.id))-effOvr(a,bonusOf(a.id)));
  const per=40,pages=Math.max(1,Math.ceil(list.length/per));
  L.page=Math.min(L.page,pages-1);
  const shown=list.slice(L.page*per,(L.page+1)*per);
  const teamsOwned=[...new Set(mine.map(c=>c.t))].sort((a,b)=>DATA.teams[a].localeCompare(DATA.teams[b]));
  return `<div class="wrap"><div class="sec">
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>YOUR FIVE</h2>
      <div class="row"><button class="btn sm" data-act="autoLineup">BEST FIVE</button><button class="btn sm" data-act="clearLineup">CLEAR</button></div></div>
    <div class="five">${slots.join('')}</div>
    <div class="panel" style="margin-top:14px"><div class="kv">
      <span>Lineup OVR</span><b>${l.length?lineupAvg().toFixed(1):'—'}</b>
      <span>Team stack</span><b>${stack}</b>
      <span>Best chemistry</span><b>${best}</b>
    </div></div>
  </div>
  <div class="sec">
    <h2>BENCH</h2>
    <div class="filters">
      <select data-chg="l.team"><option value="-1">All teams</option>${teamsOwned.map(t=>`<option value="${t}" ${L.team===t?'selected':''}>${esc(DATA.teams[t])}</option>`).join('')}</select>
      <select data-chg="l.tier"><option value="-1">All tiers</option>${TIERS.map((t,i)=>`<option value="${i}" ${L.tier===i?'selected':''}>${t.n}</option>`).join('')}</select>
      <input data-chg="l.q" inputmode="numeric" placeholder="Baller #" value="${esc(L.q)}" style="width:110px">
    </div>
    ${list.length?`<div class="cgrid sm">${shown.map(c=>cardHTML(c,{act:'slot'})).join('')}</div>`:`<div class="panel muted">${owned()?'No Ballerz match these filters.':'Your collection is empty. Open your packs to get started.'}</div>`}
    ${pages>1?`<div class="pager"><button class="btn sm" data-act="lpage" data-arg="-1" ${L.page?'':'disabled'}>PREV</button><span class="mono">PAGE ${L.page+1} / ${pages}</span><button class="btn sm" data-act="lpage" data-arg="1" ${L.page<pages-1?'':'disabled'}>NEXT</button></div>`:''}
  </div></div>`;
}

function binderList(){
  const B=UI.b;
  let list=CARDS;
  if(B.show==='owned')list=list.filter(c=>S.cards[c.id]);
  else if(B.show==='missing')list=list.filter(c=>!S.cards[c.id]);
  if(B.team>=0)list=list.filter(c=>c.t===B.team);
  if(B.tier>=0)list=list.filter(c=>c.tier===B.tier);
  if(B.q&&+B.q)list=list.filter(c=>c.id===+B.q);
  list=list.slice();
  if(B.sort==='id')list.sort((a,b)=>a.id-b.id);
  else if(SK.includes(B.sort))list.sort((a,b)=>b[B.sort]-a[B.sort]||b.ovr-a.ovr||a.id-b.id);
  else list.sort((a,b)=>b.ovr-a.ovr||a.id-b.id);
  return list;
}

function viewMatch(){
  const q=M.q,f=M.script[q],me=M.me,op=M.opp;
  const track=M.script.map((k,i)=>{
    const h=M.hist[i];
    return `<div class="qb ${i===q&&!M.done?'cur':''} ${h?(h.mp>h.op?'w':h.mp<h.op?'l':''):''}" style="--k:${SKC[k]}"><div class="q">Q${i+1}</div><div class="f">${SKN[k]}</div><div class="r">${h?`${h.mp}–${h.op}`:''}</div></div>`;
  }).join('');
  const board=`<div class="panel"><div class="score">
      <div class="side"><div class="nm">YOU</div><div class="pts">${me.pts}</div></div>
      <div class="vs">${M.mode==='court'?'DAILY COURT':LEVELS[M.lvl]}</div>
      <div class="side"><div class="nm">${logoImg(op.team)}${esc(op.name)}</div><div class="pts">${op.pts}</div></div>
    </div><div class="track">${track}</div></div>`;
  if(M.phase==='result'){
    const h=M.hist[q];
    const last=q===3;
    const win=h.mp>h.op,tie=h.mp===h.op;
    const note=(arr)=>arr.length?arr.map(esc).join(' · '):'no modifiers';
    return `<div class="wrap"><div class="sec">${board}
      <div class="focus" style="--k:${SKC[f]};margin:14px 0"><div><div class="mono">Q${q+1} FINAL · ${SKN[f]} FOCUS</div><div class="fk">${win?'YOU WIN THE QUARTER':tie?'DEAD EVEN':'THEY TAKE IT'} · ${h.mp}–${h.op}</div></div></div>
      <div class="vsrow">
        <div><div class="mono" style="margin-bottom:6px">YOUR PAIR</div><div class="pair">${h.mePair.map(c=>cardHTML(c,{mini:true,focus:f,bonus:me.bonus[c.id],tired:false})).join('')}</div>
          <div class="calc"><span class="big-score">${h.meCalc.tot}</span> <span class="muted">pair score</span><br>${note(h.meCalc.a.notes.concat(h.meCalc.b.notes,h.meCalc.notes))}</div></div>
        <div class="mid">VS</div>
        <div><div class="mono" style="margin-bottom:6px">THEIR PAIR</div><div class="pair">${h.opPair.map(c=>cardHTML(c,{mini:true,focus:f,bonus:0})).join('')}</div>
          <div class="calc"><span class="big-score">${h.opCalc.tot}</span> <span class="muted">pair score</span><br>${note(h.opCalc.a.notes.concat(h.opCalc.b.notes,h.opCalc.notes))}</div></div>
      </div>
      <div style="margin-top:18px;text-align:center"><button class="btn primary big" data-act="${last?'finish':'nextQ'}">${last?'FINAL BUZZER':'NEXT QUARTER'}</button></div>
    </div></div>`;
  }
  const calcSel=M.sel.length===2?pairCalc(me,BY.get(M.sel[0]),BY.get(M.sel[1]),f,leadOf(me,op)):null;
  const lastOpp=M.hist.length?M.hist[M.hist.length-1].opPair.map(c=>c.id):[];
  return `<div class="wrap"><div class="sec">${board}
    <div class="mono" style="margin:6px 0">${esc(op.name.toUpperCase())} · SCOUTING (open book)</div>
    <div class="five opp">${op.cards.map(c=>cardHTML(c,{mini:true,focus:f,bonus:0,tired:op.tired.has(c.id)&&!c.ab.includes('UNDEAD'),act:''})).join('')}</div>
    <div class="focus" style="--k:${SKC[f]};margin:16px 0">
      <div><div class="mono">QUARTER ${q+1} OF 4 · SPOTLIGHT</div><div class="fk">${SKN[f]}</div></div>
      <div class="mono" style="text-align:right">PICK TWO · TIRED PLAYERS −${TIRED}</div>
    </div>
    <div class="five">${me.cards.map(c=>cardHTML(c,{mini:true,focus:f,bonus:me.bonus[c.id],tired:me.tired.has(c.id)&&!c.ab.includes('UNDEAD'),sel:M.sel.includes(c.id),act:'pick'})).join('')}</div>
    <div class="panel" style="margin-top:14px">
      ${calcSel?`<div class="row" style="justify-content:space-between"><div><span class="big-score">${calcSel.tot}</span> <span class="muted">projected pair score ≈ ${calcSel.pts} pts</span>
        <div class="calc">${esc(calcSel.a.notes.concat(calcSel.b.notes,calcSel.notes).join(' · ')||'no modifiers')}</div></div>
        <button class="btn primary big" data-act="runIt">RUN IT</button></div>`
      :`<div class="muted">Pick two players to see your projected score.${lastOpp.length?` They last sent #${lastOpp.join(' & #')}.`:''}</div>`}
    </div>
    <div style="margin-top:12px"><button class="btn sm" data-act="quit">FORFEIT</button></div>
  </div></div>`;
}
const leadOf=(a,b)=>a.pts>b.pts?1:a.pts<b.pts?-1:0;

function revealHTML(res,kind,label){
  const hasLeg=res.some(x=>x.c.tier===4);
  return `<h2 style="font-size:30px">${label||(kind==='pre'?'PREMIUM PACK':'NEW PACK')}</h2>
  <div class="mono">TAP A CARD TO FLIP IT${hasLeg?' · LEGEND INSIDE':''}</div>
  <div class="rvg">${res.map((x,i)=>{
    const tag=x.isNew?'NEW':x.up?`UPGRADE → ${ED_NAMES[x.up]}`:'DUPLICATE +5 REPS';
    return `<div class="flip ${x.c.tier===4?'leg':''}" data-act="flip" data-arg="${i}"><div class="tag" style="${x.isNew?'':'background:var(--gold)'}">${tag}</div>
      <div class="flip-in"><div class="face back"><div>BALLERZ<small>RUN IT</small></div></div><div class="face front">${cardHTML(x.c,{act:'',ed:x.up!=null?x.up:undefined})}</div></div></div>`;}).join('')}</div>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-act="flipall">FLIP ALL</button><button class="btn primary" data-act="packsDone">DONE</button></div>`;
}

/* ============================ ACTIONS ============================ */
function doOpen(kind,team,label,free){
  if(!free){
    if(S.packs[kind]<=0){toast('No packs left');return;}
    S.packs[kind]--;
  }
  const res=addCards(rollPack(kind,Math.random,team));
  autoLineup(false);
  checkMilestones();
  save();
  openModal(revealHTML(res,kind,label),true);
  render(true);
}
const ACT={
  nav(a){UI.view=a;render();},
  closeModal(){closeModal();},
  help(){openModal(helpHTML());},
  packs(){
    if(S.packs.std+S.packs.pre===0&&!UI.view){return;}
    openModal(packsHTML());
  },
  open(a){doOpen(a);},
  packsDone(){closeModal();if(S.packs.std+S.packs.pre>0&&!M)openModal(packsHTML());},
  flip(a,el){el.classList.toggle('on');},
  flipall(){document.querySelectorAll('#modal .flip').forEach((e,i)=>setTimeout(()=>e.classList.add('on'),i*110));},
  daily(){
    if(S.lastDaily===today())return;
    S.streak=S.lastDaily===yesterday()?S.streak+1:1;
    S.lastDaily=today();
    S.packs.std++;
    let msg='Daily pack claimed';
    if(S.streak%7===0){S.packs.pre++;msg+=` + premium for a ${S.streak}-day streak`;}
    checkMilestones();save();render(true);toast(msg);
    openModal(packsHTML());
  },
  detail(a){openModal(detailHTML(+a));},
  slot(a,el){
    const id=+a;
    if(!S.cards[id])return;
    if(S.lineup.includes(id)){return;}
    if(S.lineup.length>=5){toast('Lineup is full — tap a starter to remove one first');return;}
    S.lineup.push(id);save();
    if(el&&el.dataset.close)closeModal();
    render(true);
  },
  unslot(a,el){
    S.lineup=S.lineup.filter(x=>x!==+a);save();
    if(el&&el.dataset.close)closeModal();
    render(true);
  },
  autoLineup(){autoLineup(true);save();render(true);},
  clearLineup(){S.lineup=[];save();render(true);},
  lpage(a){UI.l.page=Math.max(0,UI.l.page+(+a));render();},
  bpage(a){UI.b.page=Math.max(0,UI.b.page+(+a));render();},
  btab(a){UI.b.tab=a;render();},
  bshow(a){UI.b.show=a;UI.b.page=0;render(true);},
  teamFilter(a){UI.b.tab='cards';UI.b.team=+a;UI.b.show='all';UI.b.page=0;render();},
  scrap(a){
    const id=+a,c=BY.get(id);
    if(!S.cards[id]||S.lineup.includes(id))return;
    const v=SCRAP_DAP[c.tier];
    S.dap+=v;delete S.cards[id];delete S.reps[id];
    save();closeModal();render(true);toast(`Scrapped #${id} for ${v} Dap`);
  },
  scout(a){
    if(S.dap<SCOUT_COST){toast('Not enough Dap');return;}
    S.dap-=SCOUT_COST;
    doOpen('std',+a,`SCOUT PACK · ${DATA.teams[+a].toUpperCase()}`,true);
  },
  saveCode(){
    const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    openModal(`<h2 style="font-size:30px;margin-bottom:6px">SAVE CODE</h2>
      <p class="muted" style="margin:0 0 10px;font-size:14px">Your progress lives in this browser. Copy this code to move it to another device, or paste a code below to restore.</p>
      <textarea id="savebox" rows="5" style="width:100%;font-family:'IBM Plex Mono';font-size:11px;background:var(--panel-2);color:var(--bone);border:1px solid var(--line);border-radius:8px;padding:8px" readonly>${code}</textarea>
      <div class="row" style="margin:10px 0 18px"><button class="btn sm primary" data-act="copySave">COPY</button></div>
      <div class="mono">RESTORE FROM CODE</div>
      <textarea id="loadbox" rows="3" placeholder="Paste a save code here" style="width:100%;margin-top:6px;font-family:'IBM Plex Mono';font-size:11px;background:var(--panel-2);color:var(--bone);border:1px solid var(--line);border-radius:8px;padding:8px"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-act="loadSave">RESTORE (REPLACES THIS DEVICE'S SAVE)</button></div>`);
  },
  copySave(){const t=$('#savebox');t.select();try{navigator.clipboard.writeText(t.value);}catch(e){document.execCommand('copy');}toast('Save code copied');},
  loadSave(){
    try{
      const j=JSON.parse(decodeURIComponent(escape(atob($('#loadbox').value.trim()))));
      if(!j||j.v!==1||typeof j.cards!=='object')throw 0;
      S=Object.assign(fresh(),j);save();closeModal();render();toast('Save restored');
    }catch(e){toast('That code didn\'t work');}
  },
  startRun(){startMatch('run');},
  startCourt(){startMatch('court');},
  pick(a){
    const id=+a;
    if(M.phase!=='pick')return;
    const i=M.sel.indexOf(id);
    if(i>=0)M.sel.splice(i,1);
    else{M.sel.push(id);if(M.sel.length>2)M.sel.shift();}
    render(true);
  },
  runIt(){playQuarter();},
  nextQ(){M.q++;M.sel=[];M.phase='pick';render();},
  quit(){if(confirm('Forfeit this game? It counts as a loss.')){finishMatch(true);}},
  finish(){finishMatch(false);},
  shareCourt(){shareCourt();},
  endMatch(){M=null;closeModal();render();}
};

/* ============================ MATCH ENGINE ============================ */
function buildCrew(target,r){
  const eligible=DATA.teams.map((_,i)=>i).filter(i=>TEAMCARDS[i].length>=150);
  const t=pick(eligible,r);
  const near=(arr)=>arr.slice().sort((a,b)=>Math.abs(a.ovr-target)-Math.abs(b.ovr-target));
  const k=3+(r()<0.35?1:0);
  const fromTeam=shuffle(near(TEAMCARDS[t]).slice(0,12),r).slice(0,k);
  const used=new Set(fromTeam.map(c=>c.id));
  const pool=near(CARDS).filter(c=>!used.has(c.id)).slice(0,60);
  const rest=shuffle(pool,r).slice(0,5-fromTeam.length);
  return {team:t,cards:fromTeam.concat(rest)};
}
function startMatch(mode){
  if(S.lineup.length!==5){toast('Fill your lineup first');UI.view='lineup';render();return;}
  const r=mode==='court'?mulberry32(hashStr('court:'+today())):Math.random;
  const myCards=S.lineup.map(id=>BY.get(id));
  const myAvg=lineupAvg();
  const lvl=S.run.lvl;
  const target=mode==='court'?COURT_TARGET:runTarget(lvl,myAvg);
  const noise=mode==='court'?0:LEVEL_NOISE[lvl];
  const crew=buildCrew(target,r);
  const script=shuffle(SK.slice(),r);
  const me=mkSide('YOU',myCards,c=>bonusOf(c.id),true);
  const nm=DATA.teams[crew.team];
  const op=mkSide(nm,crew.cards,()=>0,false,crew.team);
  M={mode,lvl,script,q:0,me,opp:op,hist:[],sel:[],phase:'pick',noise,r,done:false,target};
  if(!S.seenHelp){S.seenHelp=true;save();openModal(helpHTML());}
  render();
}
function playQuarter(){
  if(M.sel.length!==2)return;
  const q=M.q,f=M.script[q];
  const me=M.me,op=M.opp;
  const lead=leadOf(me,op);
  const mePair=M.sel.map(id=>BY.get(id));
  const opPair=aiPick(op,f,-lead,M.r,M.noise);
  const meCalc=pairCalc(me,mePair[0],mePair[1],f,lead);
  const opCalc=pairCalc(op,opPair[0],opPair[1],f,-lead);
  me.pts+=meCalc.pts;op.pts+=opCalc.pts;
  M.hist.push({mp:meCalc.pts,op:opCalc.pts,mePair,opPair,meCalc,opCalc,f});
  me.tired=new Set(mePair.map(c=>c.id));
  op.tired=new Set(opPair.map(c=>c.id));
  mePair.forEach(c=>{S.reps[c.id]=(S.reps[c.id]||0)+1;});
  S.stats.quarters++;
  M.phase='result';
  save();render();
}
function finishMatch(forfeit){
  const me=M.me,op=M.opp;
  let win;
  if(forfeit)win=false;
  else if(me.pts!==op.pts)win=me.pts>op.pts;
  else{
    const a=M.me.cards.reduce((x,c)=>x+effOvr(c,me.bonus[c.id]),0),b=op.cards.reduce((x,c)=>x+c.ovr,0);
    win=a>=b;
  }
  const rew=[];
  const first=M.mode==='court'&&!(S.court&&S.court.date===today());
  S.stats.played++;
  if(win)S.stats.won++;
  if(M.mode==='run'){
    if(win){
      const prem=M.lvl===4;
      rew.push(grant(prem?{pre:1}:{std:1}));
      addHeat(30);rew.push('30 Heat');
      S.run.lvl++;
      if(S.run.lvl>=5){S.run.lvl=0;S.run.cycle++;S.stats.runs++;rew.push('Run cleared — tougher cycle unlocked');}
    }else{addHeat(15);rew.push('15 Heat');}
  }else{
    if(first){
      S.court={date:today(),win,me:me.pts,opp:op.pts,grid:M.hist.map(h=>h.mp>h.op?'W':h.mp<h.op?'L':'T'),team:DATA.teams[op.team]};
      if(win){rew.push(grant({std:1}));addHeat(30);rew.push('30 Heat');}
      else{addHeat(20);rew.push('20 Heat');}
    }else{addHeat(10);rew.push('10 Heat (practice)');}
  }
  checkMilestones();
  save();
  M.done=true;
  const rows=M.hist.map((h,i)=>`<tr><td>Q${i+1}</td><td>${SKN[h.f]}</td><td class="${h.mp>h.op?'w':h.mp<h.op?'l':''}">${h.mp}–${h.op}</td></tr>`).join('');
  const nextMsg=M.mode==='run'&&win&&S.run.lvl>0?`Level ${S.run.lvl+1} · ${LEVELS[S.run.lvl]} is next.`:'';
  openModal(`<div class="mono">${forfeit?'FORFEIT':M.mode==='court'?'DAILY COURT FINAL':LEVELS[M.lvl]+' FINAL'}</div>
    <h2 style="font-size:46px;margin:4px 0;color:${win?'var(--good)':'var(--bad)'}">${win?'YOU WIN':'TOUGH ONE'}</h2>
    <div class="big-score" style="margin-bottom:12px">${me.pts} – ${op.pts} <span class="muted" style="font-size:18px">vs ${esc(op.name)}</span></div>
    <table class="tbl"><tr><th>QTR</th><th>SPOTLIGHT</th><th>SCORE</th></tr>${rows}</table>
    <div class="panel" style="margin:14px 0"><div class="mono">REWARDS</div><div style="margin-top:6px">${rew.filter(Boolean).map(x=>`<span class="pill" style="margin-right:6px">${esc(x)}</span>`).join('')||'<span class="muted">Practice only</span>'}</div>${nextMsg?`<div class="muted" style="margin-top:8px;font-size:13px">${nextMsg}</div>`:''}</div>
    <div class="row">${M.mode==='court'&&first?'<button class="btn" data-act="shareCourt">COPY RESULT</button>':''}<button class="btn primary" data-act="endMatch">${M.mode==='run'&&win?'CONTINUE':'BACK'}</button></div>`);
  render(true);
}
function shareCourt(){
  const c=S.court;if(!c)return;
  const em={W:'🟩',L:'🟥',T:'⬜'};
  const t=`🏀 BALLERZ · RUN IT — Daily Court ${c.date}\n${c.grid.map(g=>em[g]).join('')}  ${c.win?'W':'L'} ${c.me}–${c.opp} vs ${c.team}\nhttps://ballerz-nft.github.io/ballerz-run-it/`;
  try{navigator.clipboard.writeText(t).then(()=>toast('Result copied'),()=>toast('Copy failed'));}catch(e){toast('Copy failed');}
}

/* ============================ EVENTS ============================ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el){
    const a=el.dataset.act;
    if(a&&ACT[a]){ACT[a](el.dataset.arg,el);}
    return;
  }
  if(e.target.id==='modal')closeModal();
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-chg]');
  if(!el)return;
  const [grp,key]=el.dataset.chg.split('.');
  const o=grp==='b'?UI.b:UI.l;
  let v=el.value;
  if(key==='team'||key==='tier')v=+v;
  o[key]=v;o.page=0;
  render(true);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ============================ BOOT ============================ */
(function boot(){
  if(!CARDS.length){document.getElementById('app').innerHTML='<div class="wrap"><p>Data missing — run tools/update-data.ps1.</p></div>';return;}
  // drop any lineup/cards that no longer exist in the dataset
  S.lineup=S.lineup.filter(id=>BY.has(id)&&S.cards[id]);
  Object.keys(S.cards).forEach(id=>{if(!BY.has(+id))delete S.cards[id];});
  checkMilestones();
  render();
  if(owned()===0&&S.packs.std>0&&!S.seenHelp){
    openModal(`<h2 style="font-size:36px">WELCOME TO THE RUN</h2>
      <p style="line-height:1.55">Collect Ballerz cards, build a five-man lineup, then outplay rival crews over four quarters. Every card is a real Baller from the collection, with its real skills.</p>
      <p class="muted">You start with <b style="color:var(--bone)">3 packs</b>. Crack them open.</p>
      <div style="text-align:right"><button class="btn primary big" data-act="closeModal">OK</button>
      <button class="btn gold big" data-act="open" data-arg="std">OPEN A PACK</button></div>`);
  }
})();
</script>
